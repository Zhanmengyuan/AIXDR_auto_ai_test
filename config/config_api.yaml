# API配置
api:
  base_url: "https://192.168.113.169:8686"
  endpoint: "/maxs/asset/manage/getDetailById"
  vuln_endpoint: "/maxs/asset/vuln/pageAssetDetail"
  alarm_endpoint: "/maxs/rv/alarm/pageAlarm"
  event_endpoint: "/maxs/rv/event/pageEvent"
  method: "POST"
  timeout: 30

# 请求头配置
headers:
  Accept: "*/*"
  Accept-Encoding: "gzip, deflate, br, zstd"
  Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
  Cache-Control: "no-cache"
  Content-Type: "application/json"
  Referer: "https://192.168.113.169:8686/maxPage/assetManageView"
  User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36"

# 登录鉴权配置
auth:
  username: "admin"
  password: "maxs.PDG~2022"
  login_endpoint: "/maxs/pm/sso/login/_login"
  public_key_endpoint: "/maxs/auth/publicKey"
  auto_login: true  # 是否自动登录获取Cookie
  cookie_lifetime: 1700  # Cookie有效期（秒），约30分钟

# Redis配置（用于绕过验证码）
redis:
  host: "192.168.113.169"
  port: 16379
  db: 2
  password: "!QAZxsw2#EDC(0Ol1)"


# 沙箱报告数据库配置（PostgreSQL，与 AIXDR 平台同机，不再硬编码）
database:
  type: PostgreSQL
  host: "192.168.113.169"
  port: 15432
  user: "root"
  password: "maxs.PDG~2022"
  dbname: "ssa"
  table: "XDR_DDAN_RESULT"          # 沙箱报告结果表
  id_column: "id"                   # 报告 ID 列
  search_column: "EXT_Field_ONE"    # 存放文件哈希/报告内容的列（哈希→ID 映射来源）


# 资产字段映射配置

# 数字人知识查询 智能体声明
agent:
  id: digital_human
  name: 数字人知识查询
  category: query            # 查询类，权重：准确性80%·可靠性10%·内容质量10%（性能不算分）

metrics:
  # ── 准确性维度（固定答案准确率）──
  - key: fixed_answer_accuracy
    name_cn: 固定答案准确率
    dimension: accuracy
    type: higher_better
    thresholds: {best: 1.0, worst: 0.0}
    required_fields: [accuracy]
    sub_weight: 100
    is_guardrail: true
    regression_threshold: 0.03

  # ── 可靠性维度 ──
  - key: repeat_stability
    name_cn: 重复稳定性
    dimension: reliability
    type: pass_fail
    thresholds: {}
    required_fields: [accuracy]
    sub_weight: 100
    is_guardrail: false
    regression_threshold: 0.10

  # ── 内容质量维度 ──
  - key: content_accuracy
    name_cn: 报告内容准确性
    dimension: content_quality
    type: higher_better
    thresholds: {best: 1.0, worst: 0.0}
    required_fields: [accuracy]
    sub_weight: 100
    is_guardrail: false
    regression_threshold: 0.05

  # ── 性能维度（只展示不算分）──
  - key: first_packet_time
    name_cn: 首包响应时间
    dimension: performance
    type: display_only
    thresholds: {}
    required_fields: [value]
    sub_weight: 50
    is_guardrail: false
    regression_threshold: 0.20

  - key: avg_response_time
    name_cn: 平均响应时间
    dimension: performance
    type: display_only
    thresholds: {}
    required_fields: [value]
    sub_weight: 50
    is_guardrail: false
    regression_threshold: 0.20

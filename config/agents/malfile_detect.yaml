# 恶意文件检测 智能体声明
agent:
  id: malfile_detect
  name: 恶意文件检测
  category: detect          # 检测研判类，权重：准确性90%·可靠性5%·内容质量5%（性能不算分）

metrics:
  # ── 准确性维度（框架从黑白样本数量计算F1）──
  - key: f1_score
    name_cn: F1
    dimension: accuracy
    type: f1
    thresholds: {best: 1.0, worst: 0.0}
    required_fields: [black_samples, black_correct, white_samples, white_correct]
    sub_weight: 100
    is_guardrail: true
    regression_threshold: 0.03

  # ── 可靠性维度 ──
  - key: stability_rate
    name_cn: 稳定性
    dimension: reliability
    type: pass_fail
    thresholds: {}
    required_fields: [accuracy]
    sub_weight: 100
    is_guardrail: false
    regression_threshold: 0.10

  # ── 内容质量维度 ──
  - key: format_compliance
    name_cn: 格式合规率
    dimension: content_quality
    type: higher_better
    thresholds: {best: 1.0, worst: 0.0}
    required_fields: [accuracy]
    sub_weight: 30
    is_guardrail: false
    regression_threshold: 0.05

  - key: content_correctness
    name_cn: 整体内容正确性
    dimension: content_quality
    type: higher_better
    thresholds: {best: 1.0, worst: 0.0}
    required_fields: [accuracy]
    sub_weight: 70
    is_guardrail: false
    regression_threshold: 0.05

  # ── 性能维度（只展示不算分）──
  - key: first_packet_time
    name_cn: 首包响应时间
    dimension: performance
    type: display_only
    thresholds: {}
    required_fields: [value]
    sub_weight: 50
    is_guardrail: false
    regression_threshold: 0.30

  - key: avg_response_time
    name_cn: 平均响应时间
    dimension: performance
    type: display_only
    thresholds: {}
    required_fields: [value]
    sub_weight: 50
    is_guardrail: false
    regression_threshold: 0.30
